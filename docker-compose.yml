services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dailychat
      POSTGRES_USER: dailychat
      POSTGRES_PASSWORD: dailychat
    ports:
      - "5432:5432"
    volumes:
      - dailychat_pg:/var/lib/postgresql/data
volumes:
  dailychat_pg:
