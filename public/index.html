<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibeMeet — Date. Connect. Belong.</title><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/style.css"></head><body>
<div id="auth" class="auth"><div class="authbox"><div class="brand"><span>💜</span><b>VibeMeet</b></div><h1 id="authTitle">Find your people.</h1><p>Dating, friendship and communities — in one place.</p><form id="form"><input id="name" placeholder="Name"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" minlength="8" required><div id="profileFields"><div class="twocol"><label>Age<input id="age" type="number" min="18" max="100" placeholder="18+"></label><label>City<input id="city" placeholder="Your city"></label></div><div class="twocol"><label>Gender<select id="gender"><option value="prefer_not_to_say">Prefer not to say</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select></label><label>Mode<select id="mode"><option value="dating">❤️ Dating</option><option value="friendship">🤝 Friendship</option><option value="community">👥 Community</option></select></label></div><label>Match preference<select id="matchPreference"><option value="any">Any gender</option><option value="same">Same gender</option><option value="opposite">Opposite gender</option></select></label></div><button class="primary">Create account</button></form><button class="secondary full" id="guestBtn">Continue as Guest</button><button class="link" id="switch">Already have an account? Login</button><small id="authMsg"></small></div></div>
<div id="app" class="hidden"><aside><div class="brand sidebrand"><span>💜</span><b>VibeMeet</b></div><div class="navlabel">DISCOVER</div><button data-page="home">✨ Discover</button><button data-page="matches">💞 Matches</button><button data-page="groups">👥 Groups</button><button data-page="events">📅 Events</button><div class="navlabel">CONNECT</div><button data-page="messages">💬 Messages</button><button data-page="people">🌐 People</button><button data-page="calls">📞 Calls</button><div class="navlabel">YOU</div><button data-page="profile">👤 Profile</button><button data-page="compatibility">🧩 Compatibility</button><button data-page="vip">♛ VIP</button><button data-page="admin" id="adminNav" class="hidden">⚙ Admin</button><button id="logout" class="logout">Log out</button></aside><main><header><button id="hamb">☰</button><input id="search" placeholder="Search people, groups or events..."><span id="me"></span></header><section id="page"></section></main></div>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
