services:
  - type: web
    name: dailychat
    runtime: node
    plan: starter
    buildCommand: npm install && npm run db:init
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dailychat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CALL_PASS_AMOUNT
        value: "99"
      - key: CALL_PASS_DAYS
        value: "7"
      - key: CORS_ORIGIN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

databases:
  - name: dailychat-db
    plan: basic-256mb
